<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Bootstrap Validation Styles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1 >Contact Form (Validation)</h1>

    <form id="contactForm"  novalidate>
      <div class="row g-3">
        <div class="col-12 col-md-6">
          <label for="name" class="form-label">Name</label>
          <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required minlength="2">
         <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback" id="nameError">Name is required</div>
        </div>

        <div class="col-12 col-md-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback" id="emailError">Email is required</div>
        </div>

        <div class="col-12">
          <label for="message" class="form-label">Message</label>
          <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your message here" required minlength="10"></textarea>
          <div class="valid-feedback">Looks good!</div>
          <div class="invalid-feedback" id="messageError">Message is required</div>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const form = document.getElementById('contactForm');

    const messages = {
      name:    { valueMissing: 'Name is required', tooShort: 'Name must be at least 2 characters' },
      email:   { valueMissing: 'Email is required', typeMismatch: 'Please enter a valid email address' },
      message: { valueMissing: 'Message is required', tooShort: 'Message must be at least 10 characters' }
    };

    function validateField(field) {
      const error = document.getElementById(field.id + 'Error');
      if (field.checkValidity()) {
        field.classList.remove('is-invalid');
        field.classList.add('is-valid');
      } else {
        const type = Object.keys(messages[field.id]).find(key => field.validity[key]);
        error.textContent = messages[field.id][type];
        field.classList.remove('is-valid');
        field.classList.add('is-invalid');
      }
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      form.querySelectorAll('input, textarea').forEach(validateField);
    });

    form.querySelectorAll('input, textarea').forEach(function (field) {
      field.addEventListener('input', function () { validateField(field); });
    });
  </script>
</body>
</html>
